name: Publish

on:
  push:
    branches: master
    paths:
      - '.github/workflows/publish.yml'
      - '**.cs'
      - '**.csproj'

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
  
      - name: Setup .NET 7
        uses: actions/setup-dotnet@master
        with:
          dotnet-version: 7.0.x
            
      - name: Pack
        run: |
          dotnet pack src/Converter.MarkdownToBBCodeNM.Tool/Converter.MarkdownToBBCodeNM.Tool.csproj --configuration Release -o ./packages;
          dotnet pack src/Converter.MarkdownToBBCodeSteam.Tool/Converter.MarkdownToBBCodeSteam.Tool.csproj --configuration Release -o ./packages;
        shell: pwsh

      - name: Upload packages
        uses: actions/upload-artifact@v3
        with:
          name: packages
          path: ./packages/

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: Aragas

      - name: Push to NuGet
        if: github.ref == 'refs/heads/master'
        run: dotnet nuget push "./packages/*.nupkg" -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} -s https://www.nuget.org
        shell: pwsh
  
      - name: Push to GPR
        if: github.ref == 'refs/heads/master'
        run: |
          for f in ./packages/*.nupkg
          do
            curl -vX PUT -u "vslee:${{secrets.GITHUB_TOKEN}}" -F package=@$f https://nuget.pkg.github.com/BUTR/
          done
